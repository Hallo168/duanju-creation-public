[project]
name = "tiktok-symphony-proxy"
version = "0.1.0"
description = "Local FastAPI proxy for OpenCLI TikTok Symphony"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=45,<47",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "keyring>=25.6,<26",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
